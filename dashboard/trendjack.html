          {/* Cultural Moment */}
          <BriefSection label="Cultural Moment" sub="The trend driving this brief" color="amber">
            <p className="text-sm text-gray-800 leading-relaxed mb-3">{brief.culturalMoment.description}</p>
            {brief.culturalMoment.examplePosts && brief.culturalMoment.examplePosts.length > 0 && (
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Example posts ({brief.culturalMoment.examplePosts.length})</div>
                <div className="space-y-2">
                  {brief.culturalMoment.examplePosts.map((p, idx) => (
                    <div key={idx} className="bg-white border border-gray-200 rounded-lg p-3">
                      <div className="text-xs text-gray-400 mb-1.5 flex items-center justify-between gap-2">
                        <span className="truncate">{p.platform} · {p.author}</span>
                        {p.url && (
                          <a href={p.url} target="_blank" rel="noopener noreferrer" className="text-teal-600 hover:text-teal-700 font-medium flex-shrink-0 whitespace-nowrap">View ↗</a>
                        )}
                      </div>
                      <p className="text-sm text-gray-700 italic">"{p.text}"</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </BriefSection>

          {/* Trend Evidence — snapshot of metric data validating the trend */}
          <BriefSection
            label="Trend Evidence"
            sub={brief.metrics.isLiveData ? `Snapshot from Meltwater · ${brief.metrics.windowLabel}` : `Mock data · ${brief.metrics.windowLabel}`}
          >
            <div className="grid grid-cols-4 gap-3 mb-4">
              <div className="bg-white border border-gray-200 rounded-lg p-3">
                <div className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Social mentions</div>
                <div className="text-2xl font-bold text-gray-900 leading-none">{brief.metrics.socialTotal.toLocaleString()}</div>
                <div className="text-xs text-gray-500 mt-1">over last 72h</div>
              </div>
              <div className="bg-white border border-gray-200 rounded-lg p-3">
                <div className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">News mentions</div>
                <div className="text-2xl font-bold text-gray-900 leading-none">{brief.metrics.newsTotal.toLocaleString()}</div>
                <div className="text-xs text-gray-500 mt-1">over last 72h</div>
              </div>
              <div className="bg-white border border-gray-200 rounded-lg p-3">
                <div className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Momentum</div>
                <div className="mt-1"><MomentumPill momentum={brief.metrics.momentum} /></div>
              </div>
              <div className="bg-white border border-gray-200 rounded-lg p-3">
                <div className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Confidence</div>
                <div className="text-base font-bold text-gray-900">{brief.metrics.confidence}</div>
              </div>
            </div>

            {brief.metrics.hashtags.length > 0 && (
              <div className="mb-3">
                <div className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Top hashtags driving the conversation</div>
                <div className="flex flex-wrap gap-1.5">
                  {brief.metrics.hashtags.map(h => <span key={h} className="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-medium">{h}</span>)}
                </div>
              </div>
            )}

            <div className="text-xs text-gray-500 border-t border-gray-200 pt-2.5 mt-2">
              <strong>Data source:</strong>{" "}
              {brief.metrics.isLiveData
                ? "Meltwater social listening"
                : "Mock/illustrative — replace with live Meltwater data"}
              {brief.metrics.capturedAt && <span>{" · Captured "}{new Date(brief.metrics.capturedAt).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span>}
            </div>
          </BriefSection>

          {/* Why relevant */}
          <BriefSection label={`Why It's Relevant for ${brand.name}`}>
            <div className="space-y-2">
              {brief.whyRelevant.map((r, i) => (
                <div key={i} className="flex gap-2 text-sm">
                  <span className="text-teal-500 flex-shrink-0 mt-0.5">✓</span>
                  <span className="text-gray-700 leading-relaxed">{r}</span>
                </div>
              ))}
            </div>
          </BriefSection>

          {/* Campaign Objective */}
          <BriefSection label="Campaign Objective / KPIs">
            <p className="text-sm text-gray-800 leading-relaxed">{brief.objective}</p>
          </BriefSection>

          {/* Campaign Overview */}
          <BriefSection label="Campaign Overview">
            <p className="text-sm text-gray-800 leading-relaxed">{brief.overview}</p>
          </BriefSection>

          {/* Messaging & Content */}
          <BriefSection label="Messaging & Content" sub="What to say and how to show it">
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Key messages</div>
            <ul className="space-y-1 mb-3">
              {brief.messaging.keyMessages.map((k, i) => <li key={i} className="text-sm text-gray-700">· {k}</li>)}
            </ul>
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">CTA</div>
            <p className="text-sm text-gray-700 mb-3">{brief.messaging.cta}</p>
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Hashtags</div>
            <div className="flex flex-wrap gap-1.5">
              {brief.messaging.hashtags.map(h => <span key={h} className="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-medium">{h}</span>)}
            </div>
          </BriefSection>

          {/* Targeting */}
          <BriefSection label="Targeting" color="blue">
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Organic targeting</div>
            <p className="text-sm text-gray-800 mb-3">{brief.targeting.organic}</p>
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Paid targeting</div>
            <p className="text-sm text-gray-800">{brief.targeting.paid}</p>
          </BriefSection>

          {/* Influencer Criteria */}
          <BriefSection label="Influencer Criteria" sub={brief.influencerCriteria.tier}>
            <p className="text-sm text-gray-800 leading-relaxed mb-3">{brief.influencerCriteria.description}</p>
            <ul className="space-y-1">
              {brief.influencerCriteria.criteria.map((c, i) => <li key={i} className="text-xs text-gray-600">· {c}</li>)}
            </ul>
          </BriefSection>

          {/* About brand + product */}
          <div className="grid grid-cols-2 gap-3">
            <BriefSection label="About the Brand">
              <p className="text-sm text-gray-800 leading-relaxed">{brief.aboutBrand}</p>
            </BriefSection>
            <BriefSection label="About the Product">
              <p className="text-sm text-gray-800 leading-relaxed">{brief.aboutProduct}</p>
            </BriefSection>
          </div>

          {/* Do's & Don'ts */}
          <div className="grid grid-cols-2 gap-3">
            <BriefSection label="Do's" color="green">
              <ul className="space-y-1.5">
                {brief.dos.map((d, i) => <li key={i} className="text-sm text-gray-800 flex gap-2"><span className="text-green-600 flex-shrink-0">+</span><span>{d}</span></li>)}
              </ul>
            </BriefSection>
            <BriefSection label="Don'ts" color="red">
              <ul className="space-y-1.5">
                {brief.donts.map((d, i) => <li key={i} className="text-sm text-gray-800 flex gap-2"><span className="text-red-600 flex-shrink-0">−</span><span>{d}</span></li>)}
              </ul>
            </BriefSection>
          </div>

          {/* Brand Tool Kit */}
          <BriefSection label="Brand Tool Kit" sub="What to use — from assets to inspiration">
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Tagline to use</div>
            <p className="text-sm text-gray-900 font-semibold mb-3">"{brief.toolkit.tagline}"</p>
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Distinctive Brand Assets</div>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {brief.toolkit.dbas.map(d => <span key={d} className="text-xs bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded">{d}</span>)}
            </div>
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Colours</div>
            <div className="flex flex-wrap gap-1.5">
              {brief.toolkit.colors.map(c => <span key={c} className="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded">{c}</span>)}
            </div>
            {brief.toolkit.mascot && (
              <div className="mt-3">
                <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Mascot</div>
                <p className="text-sm text-gray-700">{brief.toolkit.mascot}</p>
              </div>
            )}
            <div className="mt-3">
              <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Brand handles to tag</div>
              <div className="flex flex-wrap gap-2 text-sm">
                {Object.entries(brief.toolkit.handles).filter(([k]) => k !== "note").map(([p, h]) => (
                  <span key={p} className="font-mono text-gray-800 bg-gray-50 border border-gray-200 px-2 py-0.5 rounded">
                    <span className="text-xs uppercase text-gray-400 mr-1">{p}</span>{h}
                  </span>
                ))}
              </div>
            </div>
          </BriefSection>

          {/* Posting Timeline */}
          <BriefSection label="Posting Timeline">
            <div className="space-y-1.5">
              {brief.timeline.map((t, i) => (
                <div key={i} className="flex items-center justify-between text-sm border-b border-gray-200 last:border-0 pb-1.5">
                  <span className="text-gray-800">{t.stage}</span>
                  <span className="text-gray-500 text-xs">{t.date}</span>
                </div>
              ))}
            </div>
          </BriefSection>

          {/* Channels & Response Format */}
          <div className="grid grid-cols-2 gap-3">
            <BriefSection label="Recommended Channels">
              <div className="flex flex-wrap gap-1.5">
                {brief.channels.map(c => <span key={c} className="text-sm bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded">{c}</span>)}
              </div>
            </BriefSection>
            <BriefSection label="Response Format">
              <p className="text-sm text-gray-800 leading-relaxed">{brief.responseFormat}</p>
            </BriefSection>
          </div>
        </div>
      );
    }

    // Build clean inline-styled HTML for the Word export.
    // html-docx-js drops most class-based CSS, so we generate inline styles on tables and elements directly.
    function renderBriefAsWordHtml(brief, brand, trend) {
      const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const h = brief.header || {};
      const m = brief.metrics || {};
      const cm = brief.culturalMoment || {};
      const msg = brief.messaging || {};
      const tg = brief.targeting || {};
      const ic = brief.influencerCriteria || {};
      const tk = brief.toolkit || {};

      const C = {
        slate:  "#0F172A",
        teal:   "#14B8A6",
        tealLt: "#F0FDFA",
        amber:  "#D97706",
        amberLt:"#FFFBEB",
        gray:   "#6B7280",
        line:   "#E5E7EB",
        text:   "#111827",
        green:  "#16A34A",
        red:    "#DC2626",
        bgGray: "#F9FAFB",
      };

      const fontStack = "Calibri, Arial, sans-serif";

      const sectionH2 = (title) => `<h2 style="font-family:${fontStack}; color:${C.teal}; font-size:14pt; margin:18pt 0 6pt 0; padding-bottom:3pt; border-bottom:2pt solid ${C.teal};">${esc(title)}</h2>`;

      const labelValueRow = (label, value) =>
        `<tr>
          <td style="width:35%; padding:6pt; border:0.75pt solid ${C.line}; background-color:${C.bgGray}; font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold;">${esc(label)}</td>
          <td style="padding:6pt; border:0.75pt solid ${C.line}; font-size:11pt; color:${C.text};">${esc(value)}</td>
        </tr>`;

      const owStyle = {
        ACT_NOW:    { bg: "#DCFCE7", text: "#15803D", label: "⚡ Act Now"          },
        TOO_LATE:   { bg: "#FEE2E2", text: "#991B1B", label: "⏱ Probably Too Late" },
        JOURNALIST: { bg: "#F1F5F9", text: "#334155", label: "📰 Journalist Trend" },
        WATCH:      { bg: "#FEF3C7", text: "#92400E", label: "👁 Watch & Wait"     },
      }[brief.opportunityWindow] || { bg: "#F3F4F6", text: "#374151", label: brief.opportunityWindow || "" };

      const momentumStyle = {
        rising:    { bg: "#DCFCE7", text: "#15803D", label: "🚀 Rising"     },
        emerging:  { bg: "#F0FDFA", text: "#0F766E", label: "⚡ Emerging"   },
        peaked:    { bg: "#FEF3C7", text: "#92400E", label: "🔥 Peaked"     },
        steady:    { bg: "#F3F4F6", text: "#374151", label: "→ Steady"      },
        declining: { bg: "#F1F5F9", text: "#475569", label: "📉 Declining"  },
      }[m.momentum] || { bg: "#F3F4F6", text: "#374151", label: m.momentum || "—" };

      // ---- HEADER BAND ----
      let html = `
      <div style="font-family:${fontStack}; color:${C.text};">
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
          <tr>
            <td style="background-color:${C.slate}; padding:16pt 20pt; color:white;">
              <div style="font-size:9pt; color:#94A3B8; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4pt;">Influencer Brief · ${esc(brand.name)}</div>
              <div style="font-size:20pt; font-weight:bold; line-height:1.2;">${esc(trend.name)}</div>
            </td>
          </tr>
        </table>

        <p style="font-size:12pt; font-style:italic; padding:12pt 16pt; background-color:${C.tealLt}; border-left:4pt solid ${C.teal}; margin:0 0 14pt 0;">${esc(brief.oneLine)}</p>

        <!-- Status strip: opportunity window + activation + score -->
        <table cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin:0 0 16pt 0;">
          <tr>
            <td style="padding:6pt 12pt; background-color:${owStyle.bg}; color:${owStyle.text}; font-weight:bold; font-size:11pt; border-radius:4pt;">${esc(owStyle.label)}</td>
            ${brief.activationLink ? `<td style="padding-left:8pt;"><span style="padding:6pt 12pt; background-color:${C.amberLt}; color:${C.amber}; font-weight:bold; font-size:11pt;">⚡ ${esc(brief.activationLink)}</span></td>` : ""}
            <td style="padding-left:8pt;"><span style="padding:6pt 12pt; background-color:${C.bgGray}; color:${C.text}; font-weight:bold; font-size:11pt; border:1pt solid ${C.line};">Score ${esc(brief.trendScore)}/10</span></td>
          </tr>
        </table>

        <!-- METADATA TABLE -->
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
          ${labelValueRow("Project / Campaign", h.projectName)}
          ${labelValueRow("Brand / Category",   h.brandCategory)}
          ${labelValueRow("Market",             h.market)}
          ${labelValueRow("Brand Lead",         h.brandLead)}
          ${labelValueRow("Product",            h.product)}
          ${labelValueRow("Briefing Date",      h.briefingDate)}
          ${labelValueRow("Live Date",          h.liveDate)}
          ${labelValueRow("End Date",           h.endDate)}
        </table>
      `;

      // ---- CULTURAL MOMENT ----
      html += sectionH2("Cultural Moment");
      html += `<p style="font-size:11pt; margin:0 0 10pt 0;">${esc(cm.description)}</p>`;
      const posts = cm.examplePosts || (cm.examplePost ? [cm.examplePost] : []);
      if (posts.length) {
        html += `<div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:6pt;">Example posts (${posts.length})</div>`;
        for (const p of posts) {
          html += `
            <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin-bottom:6pt;">
              <tr>
                <td style="padding:8pt 10pt; border:0.75pt solid ${C.line}; background-color:${C.bgGray};">
                  <div style="font-size:9pt; color:${C.gray}; margin-bottom:3pt;"><strong>${esc(p.platform)}</strong> · ${esc(p.author)}${p.url ? ` · <a href="${esc(p.url)}" style="color:${C.teal};">View original ↗</a>` : ""}</div>
                  <div style="font-size:11pt; font-style:italic; color:${C.text};">"${esc(p.text)}"</div>
                </td>
              </tr>
            </table>`;
        }
      }

      // ---- TREND EVIDENCE (KPI table) ----
      html += sectionH2("Trend Evidence");
      const subLine = m.isLiveData ? `Snapshot from Meltwater · ${esc(m.windowLabel)}` : `Mock data · ${esc(m.windowLabel)}`;
      html += `<div style="font-size:9pt; color:${C.gray}; margin-bottom:6pt;">${subLine}</div>`;
      html += `
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin-bottom:10pt;">
          <tr>
            <td width="25%" style="border:0.75pt solid ${C.line}; padding:10pt; vertical-align:top;">
              <div style="font-size:8pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3pt;">Social mentions</div>
              <div style="font-size:18pt; font-weight:bold;">${esc(Number(m.socialTotal || 0).toLocaleString())}</div>
              <div style="font-size:9pt; color:${C.gray};">over last 72h</div>
            </td>
            <td width="25%" style="border:0.75pt solid ${C.line}; padding:10pt; vertical-align:top;">
              <div style="font-size:8pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3pt;">News mentions</div>
              <div style="font-size:18pt; font-weight:bold;">${esc(Number(m.newsTotal || 0).toLocaleString())}</div>
              <div style="font-size:9pt; color:${C.gray};">over last 72h</div>
            </td>
            <td width="25%" style="border:0.75pt solid ${C.line}; padding:10pt; vertical-align:top;">
              <div style="font-size:8pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3pt;">Momentum</div>
              <div style="padding:4pt 8pt; background-color:${momentumStyle.bg}; color:${momentumStyle.text}; font-weight:bold; font-size:10pt; display:inline-block;">${esc(momentumStyle.label)}</div>
            </td>
            <td width="25%" style="border:0.75pt solid ${C.line}; padding:10pt; vertical-align:top;">
              <div style="font-size:8pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3pt;">Confidence</div>
              <div style="font-size:13pt; font-weight:bold;">${esc(m.confidence)}</div>
            </td>
          </tr>
        </table>`;

      if (m.hashtags && m.hashtags.length) {
        html += `<div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:4pt;">Top hashtags</div>`;
        html += `<p style="font-size:11pt; color:${C.teal}; margin:0 0 10pt 0;">${m.hashtags.map(t => esc(t)).join("&nbsp;&nbsp;")}</p>`;
      }
      html += `<p style="font-size:9pt; color:${C.gray}; padding-top:6pt; border-top:0.5pt solid ${C.line}; margin-top:6pt;"><strong>Data source:</strong> ${m.isLiveData ? "Meltwater social listening" : "Mock / illustrative"}${m.capturedAt ? ` · Captured ${esc(new Date(m.capturedAt).toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }))}` : ""}</p>`;

      // ---- WHY RELEVANT ----
      html += sectionH2(`Why It's Relevant for ${brand.name}`);
      if (brief.whyRelevant && brief.whyRelevant.length) {
        html += `<ul style="font-size:11pt; padding-left:20pt; margin:0 0 10pt 0;">`;
        for (const r of brief.whyRelevant) html += `<li style="margin-bottom:5pt;">${esc(r)}</li>`;
        html += `</ul>`;
      }

      // ---- OBJECTIVE / OVERVIEW ----
      html += sectionH2("Campaign Objective / KPIs");
      html += `<p style="font-size:11pt; margin:0 0 6pt 0;">${esc(brief.objective)}</p>`;

      html += sectionH2("Campaign Overview");
      html += `<p style="font-size:11pt; margin:0 0 6pt 0;">${esc(brief.overview)}</p>`;

      // ---- MESSAGING ----
      html += sectionH2("Messaging & Content");
      if (msg.keyMessages && msg.keyMessages.length) {
        html += `<div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:4pt;">Key messages</div>`;
        html += `<ul style="font-size:11pt; padding-left:20pt; margin:0 0 8pt 0;">`;
        for (const k of msg.keyMessages) html += `<li style="margin-bottom:3pt;">${esc(k)}</li>`;
        html += `</ul>`;
      }
      html += `<div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:4pt;">Call to action</div>`;
      html += `<p style="font-size:11pt; margin:0 0 8pt 0;">${esc(msg.cta)}</p>`;
      if (msg.hashtags && msg.hashtags.length) {
        html += `<div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:4pt;">Hashtags</div>`;
        html += `<p style="font-size:11pt; color:${C.teal}; margin:0 0 6pt 0;">${msg.hashtags.map(t => esc(t)).join("&nbsp;&nbsp;")}</p>`;
      }

      // ---- TARGETING ----
      html += sectionH2("Targeting");
      html += `
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin-bottom:8pt;">
          <tr>
            <td width="50%" style="border:0.75pt solid ${C.line}; padding:10pt; vertical-align:top;">
              <div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:4pt;">Organic targeting</div>
              <div style="font-size:11pt;">${esc(tg.organic)}</div>
            </td>
            <td width="50%" style="border:0.75pt solid ${C.line}; padding:10pt; vertical-align:top;">
              <div style="font-size:9pt; color:${C.gray}; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold; margin-bottom:4pt;">Paid targeting</div>
              <div style="font-size:11pt;">${esc(tg.paid)}</div>
            </td>
          </tr>
        </table>`;

      // ---- INFLUENCER CRITERIA ----
      html += sectionH2("Influencer Criteria");
      if (ic.tier) html += `<div style="font-size:10pt; color:${C.gray}; font-style:italic; margin-bottom:6pt;">${esc(ic.tier)}</div>`;
      html += `<p style="font-size:11pt; margin:0 0 6pt 0;">${esc(ic.description)}</p>`;
      if (ic.criteria && ic.criteria.length) {
        html += `<ul style="font-size:11pt; padding-left:20pt; margin:0 0 6pt 0;">`;
        for (const c of ic.criteria) html += `<li style="margin-bottom:3pt;">${esc(c)}</li>`;
        html += `</ul>`;
      }

      // ---- ABOUT BRAND / PRODUCT ----
      html += `
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin-top:14pt;">
          <tr>
            <td width="50%" style="vertical-align:top; padding-right:6pt;">
              ${sectionH2("About the Brand")}
              <p style="font-size:11pt; margin:0;">${esc(brief.aboutBrand)}</p>
            </td>
            <td width="50%" style="vertical-align:top; padding-left:6pt;">
              ${sectionH2("About the Product")}
              <p style="font-size:11pt; margin:0;">${esc(brief.aboutProduct)}</p>
            </td>
          </tr>
        </table>`;

      // ---- DO'S & DON'TS ----
      html += `
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin-top:14pt;">
          <tr>
            <td width="50%" style="vertical-align:top; padding:10pt; border:0.75pt solid ${C.green}; background-color:#F0FDF4;">
              <div style="color:${C.green}; font-weight:bold; font-size:11pt; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6pt;">✓ Do's</div>
              ${(brief.dos || []).map(d => `<div style="font-size:11pt; margin-bottom:4pt;"><strong style="color:${C.green};">+</strong> ${esc(d)}</div>`).join("")}
            </td>
            <td width="50%" style="vertical-align:top; padding:10pt; border:0.75pt solid ${C.red}; background-color:#FEF2F2;">
              <div style="color:${C.red}; font-weight:bold; font-size:11pt; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6pt;">✗ Don'ts</div>
              ${(brief.donts || []).map(d => `<div style="font-size:11pt; margin-bottom:4pt;"><strong style="color:${C.red};">−</strong> ${esc(d)}</div>`).join("")}
            </td>
          </tr>
        </table>`;

      // ---- BRAND TOOL KIT ----
      html += sectionH2("Brand Tool Kit");
      html += `<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">`;
      html += labelValueRow("Tagline to use", `"${tk.tagline || ""}"`);
      if (tk.dbas && tk.dbas.length) html += labelValueRow("Distinctive Brand Assets", tk.dbas.join(" · "));
      if (tk.colors && tk.colors.length) html += labelValueRow("Colours", tk.colors.join(" · "));
      if (tk.mascot) html += labelValueRow("Mascot", tk.mascot);
      if (tk.handles) {
        const handles = Object.entries(tk.handles).filter(([k]) => k !== "note").map(([p, h]) => `${p}: ${h}`).join(" · ");
        if (handles) html += labelValueRow("Brand handles to tag", handles);
      }
      html += `</table>`;

      // ---- POSTING TIMELINE ----
      html += sectionH2("Posting Timeline");
      html += `<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">`;
      for (const t of brief.timeline || []) {
        html += `<tr>
          <td style="padding:6pt 10pt; border-bottom:0.5pt solid ${C.line}; font-size:11pt;">${esc(t.stage)}</td>
          <td style="padding:6pt 10pt; border-bottom:0.5pt solid ${C.line}; font-size:10pt; color:${C.gray}; text-align:right;">${esc(t.date)}</td>
        </tr>`;
      }
      html += `</table>`;

      // ---- CHANNELS + RESPONSE FORMAT ----
      html += `
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; margin-top:14pt;">
          <tr>
            <td width="50%" style="vertical-align:top; padding-right:6pt;">
              ${sectionH2("Recommended Channels")}
              <p style="font-size:11pt; margin:0;">${(brief.channels || []).map(c => esc(c)).join(" · ")}</p>
            </td>
            <td width="50%" style="vertical-align:top; padding-left:6pt;">
              ${sectionH2("Response Format")}
              <p style="font-size:11pt; margin:0;">${esc(brief.responseFormat)}</p>
            </td>
          </tr>
        </table>`;

      html += `</div>`;
      return html;
    }

    function BriefModal({ trend, score, brand, liveMeta, onClose }) {
      const brief = useMemo(() => buildBrief(trend, score, brand, liveMeta), [trend, score, brand, liveMeta]);
      const briefRef = React.useRef(null);
      const [downloading, setDownloading] = useState(false);

      const downloadDocx = () => {
        if (downloading) return;
        setDownloading(true);
        try {
          const safe = (s) => (s || "").replace(/[^a-zA-Z0-9-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
          const dateStamp = new Date().toISOString().slice(0, 10);
          const filename = `TrendBlender_${safe(brand.name)}_${safe(trend.name)}_${dateStamp}.docx`;

          const body = renderBriefAsWordHtml(brief, brand, trend);
          const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${trend.name}</title></head><body>${body}</body></html>`;
          const blob = window.htmlDocx.asBlob(html, { orientation: "portrait", margins: { top: 720, right: 720, bottom: 720, left: 720 } });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {
          console.error("Word export failed:", e);
        } finally {
          setDownloading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-stretch justify-end" onClick={onClose}>
          <div className="bg-white w-full max-w-3xl overflow-y-auto shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between z-10">
              <div>
                <div className="text-xs text-gray-400 mb-0.5">Influencer Brief — {brand.name}</div>
                <h3 className="font-bold text-gray-900 text-lg leading-tight">{trend.name}</h3>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={downloadDocx}
                  disabled={downloading}
                  className={`text-sm px-4 py-2 rounded-lg font-medium transition-colors ${downloading ? "bg-gray-300 text-gray-500 cursor-wait" : "bg-teal-500 hover:bg-teal-600 text-white"}`}
                >
                  {downloading ? "Generating…" : "↓ Download Word"}
                </button>
                <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
              </div>
            </div>
            <div className="p-6 flex-1" ref={briefRef}>
              <BriefBody brief={brief} brand={brand} />
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // MORNING BRIEF MODAL
    // ═══════════════════════════════════════════════════════════════════════════

    const BRIEF_KIND_STYLES = {
      strongest_signal:     { icon: "🔥", accent: "border-red-300 bg-red-50",      label: "text-red-700" },
      earned_media:         { icon: "📰", accent: "border-blue-300 bg-blue-50",    label: "text-blue-700" },
      creator_opportunity:  { icon: "🤝", accent: "border-teal-300 bg-teal-50",    label: "text-teal-700" },
      data_quality:         { icon: "⚠️", accent: "border-amber-300 bg-amber-50",  label: "text-amber-700" },
      time_sensitive:       { icon: "⏰", accent: "border-purple-300 bg-purple-50", label: "text-purple-700" },
    };

    function MorningBriefModal({ brief, onClose }) {
      const briefDate = brief?.date
        ? new Date(brief.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
        : "Today";
      const refreshedLabel = brief?.generated_at
        ? new Date(brief.generated_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
        : null;

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-stretch justify-end" onClick={onClose}>
          <div className="bg-white w-full max-w-2xl overflow-y-auto shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between z-10">
              <div>
                <div className="text-xs text-gray-400 mb-0.5 uppercase tracking-wider">Morning Brief</div>
                <h3 className="font-bold text-gray-900 text-lg leading-tight">{briefDate}</h3>
                {refreshedLabel && (
                  <div className="text-xs text-gray-500 mt-1">Generated {refreshedLabel} · covers {(brief.generated_for || []).join(" · ")}</div>
                )}
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
            </div>
            <div className="p-6 flex-1 space-y-4">
              {!brief && (
                <div className="text-sm text-gray-500 italic">No morning brief available yet. The daily refresh writes one at ~22:00 UK time.</div>
              )}
              {brief?.bullets?.map((b, i) => {
                const s = BRIEF_KIND_STYLES[b.kind] || { icon: "•", accent: "border-gray-200 bg-gray-50", label: "text-gray-700" };
                return (
                  <div key={i} className={`rounded-xl border ${s.accent} p-5`}>
                    <div className="flex items-start gap-3">
                      <div className="text-xl flex-shrink-0 leading-none mt-0.5">{s.icon}</div>
                      <div className="min-w-0 flex-1">
                        <div className={`text-xs font-semibold uppercase tracking-wider ${s.label}`}>{b.label}</div>
                        <h4 className="font-semibold text-gray-900 mt-1 leading-snug">{b.title}</h4>
                        <p className="text-sm text-gray-700 mt-2 leading-relaxed">{b.body}</p>
                        {b.brand_relevance?.length > 0 && (
                          <div className="flex flex-wrap gap-1.5 mt-3">
                            {b.brand_relevance.map(bk => {
                              const cfg = getBrandConfig();
                              const label = (cfg && cfg.brand && cfg.brand.id === bk) ? cfg.brand.name : bk;
                              return (
                                <span key={bk} className="text-[10px] font-medium bg-white border border-gray-200 text-gray-600 px-2 py-0.5 rounded uppercase tracking-wide">
                                  {label}
                                </span>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
              <div className="text-xs text-gray-400 text-center pt-2 pb-2 italic">
                Refreshes daily at 22:00 UK. To regenerate now, ask Claude to run the trends refresh.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // APP
    // ═══════════════════════════════════════════════════════════════════════════

    function App() {
      // Single-brand-per-install: brandKey and brand identity come entirely from
      // window.BRAND_CONFIG (or the placeholder fallback if it hasn't loaded).
      // There is no brand switcher any more — flatten brand.* alongside the rest
      // of the config so the rest of the app can keep reading brand.name,
      // brand.category etc. directly.
      const cfg = getBrandConfig();
      const brand = {
        ...cfg.brand,
        identity: cfg.identity,
        audienceSegments: cfg.audienceSegments,
        activations: cfg.activations,
        territory: cfg.territory,
        rejectList: cfg.rejectList,
        pillars: cfg.pillars,
        scoring: cfg.scoring,
        ops: cfg.ops,
        meta: cfg.meta,
      };
      const brandKey = brand.id;

      const [section, setSection]         = useState("trends");
      const [briefModal, setBriefModal]   = useState(null);
      const [showMorningBrief, setShowMorningBrief] = useState(false);
      const morningBrief = (typeof window !== "undefined" && window.MORNING_BRIEF) || null;

      const live = liveTrendsFor(brandKey);
      const trends = live ? live.trends : MOCK_TRENDS;
      const liveMeta = live ? { generated_at: live.generated_at, source_searches: live.source_searches, data_quality_notes: live.data_quality_notes } : null;
      const actNowCount = trends.filter(t => opportunityWindow(t.social, t.news) === "ACT_NOW").length;

      const nav = [
        { id: "brand",  icon: "🧬", label: "Brand DNA" },
        { id: "trends", icon: "📈", label: "Trends",   badge: actNowCount },
      ];

      return (
        <div className="flex h-screen bg-gray-50 font-sans overflow-hidden">
          {/* Sidebar */}
          <div className="w-56 bg-slate-900 flex flex-col flex-shrink-0 shadow-xl">
            <div className="px-5 py-5 border-b border-slate-700">
              <div className="text-white font-bold text-lg">{(brand.identity && brand.identity.logoText) || "TrendBlender"}</div>
              <div className="text-slate-400 text-xs mt-0.5">Meltwater trend intelligence</div>
            </div>

            {/* Single-brand identity display — no brand switcher. Each plugin build
                is scoped to exactly one brand via brand_config.js (window.BRAND_CONFIG). */}
            <div className="px-4 py-3 border-b border-slate-700">
              <div className="w-full bg-slate-800 rounded-lg px-3 py-2.5">
                <div className="text-white text-sm font-semibold">{brand.name}</div>
                <div className="text-slate-400 text-xs">{brand.category}</div>
              </div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-1">
              {nav.map(item => (
                <button key={item.id} onClick={() => setSection(item.id)} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm transition-colors ${section === item.id ? "bg-teal-500 text-white font-semibold" : "text-slate-300 hover:bg-slate-800 hover:text-white"}`}>
                  <span className="flex items-center gap-2.5">
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </span>
                  {item.badge ? (
                    <span className={`text-xs font-bold px-1.5 py-0.5 rounded-full ${section === item.id ? "bg-white text-teal-600" : "bg-teal-500 text-white"}`}>{item.badge}</span>
                  ) : null}
                </button>
              ))}
            </nav>

            <div className="px-4 py-4 border-t border-slate-700">
              <div className="text-slate-600 text-xs">Last updated: Today</div>
            </div>
          </div>

          {/* Main */}
          <div className="flex-1 overflow-y-auto">
            {/* Top bar — Morning Brief access */}
            <div className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-200 px-6 py-2.5 flex items-center justify-end gap-3">
              {morningBrief?.date && (
                <span className="text-xs text-gray-500">
                  Brief generated {new Date(morningBrief.generated_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}
                </span>
              )}
              <button
                onClick={() => setShowMorningBrief(true)}
                disabled={!morningBrief}
                className={`text-sm px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 ${morningBrief ? "bg-slate-900 hover:bg-slate-800 text-white" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
                title={morningBrief ? "Open today's morning brief" : "No morning brief available yet"}
              >
                <span>📋</span>
                <span>Morning Brief</span>
              </button>
            </div>
            {section === "brand"  && <BrandDNA brand={brand} />}
            {section === "trends" && <Trends brand={brand} trends={trends} liveMeta={liveMeta} onBrief={(trend, score) => setBriefModal({ trend, score })} />}
          </div>

          {briefModal && <BriefModal trend={briefModal.trend} score={briefModal.score} brand={brand} liveMeta={liveMeta} onClose={() => setBriefModal(null)} />}
          {showMorningBrief && <MorningBriefModal brief={morningBrief} onClose={() => setShowMorningBrief(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
